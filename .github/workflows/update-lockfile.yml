
name: Update dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only

      - name: Verify proxy-addr version
        run: |
          npm ls proxy-addr
          node -e "const p=require('./package-lock.json'); console.log('proxy-addr:', p.packages['node_modules/proxy-addr']?.version)"

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update vulnerable proxy-addr dependency"
          git push
